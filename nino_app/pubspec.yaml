name: nino_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.0+1
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_secure_storage: ^10.0.0
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^17.1.0
  image_picker: ^1.2.0
  lucide_icons: ^0.257.0
  mobile_scanner: ^7.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  photo_manager: ^3.9.0
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nino.png
    - assets/coco.png
    - assets/adoption-box.png
    - assets/lili.png
    - assets/mimi.png
    - assets/bobo.png
    - assets/nino-truck.png

  fonts:
    - family: Gaegu
      fonts:
        - asset: assets/fonts/Gaegu-Regular.ttf
        - asset: assets/fonts/Gaegu-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        # The bundled Nunito asset is a variable font, so reuse the same
        # verified binary for the weights used by the app.
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 800
